# Tests for pull requests and branches other than main (main is tested by pages.yml before it deploys).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test tests/unit/*.test.mjs
      - run: node scripts/build.mjs --check
      - run: node scripts/check-plugin.mjs
      - run: node scripts/build.mjs
      - run: node tests/e2e/run.mjs
